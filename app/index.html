<title>Runway</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1317">

<style>
/* Committed dark: this lives on a phone, beside banking apps, often checked at
   night. Every colour is painted explicitly so it holds on any host ground. */
:root{
  --ground:#0F1317; --surface:#181D23; --surface-2:#1F262E; --line:#2A323C;
  --ink:#E6EBF2; --ink-2:#9DA9BA; --ink-3:#68738A;
  --accent:#7D9BC1; --accent-ink:#0F1317;
  --in:#4EC9A0; --out:#D98E73; --tight:#E3B341; --under:#F0605D;
  --chart:#5B9BD5;
  --r:14px; --pad:16px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--f);
  font-size:15px; line-height:1.45; overscroll-behavior-y:none;
}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:var(--pad) var(--pad) 96px;display:none}
main.on{display:block}
h1{font-size:19px;font-weight:650;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
   color:var(--ink-3);margin:26px 0 10px}
h2:first-child{margin-top:4px}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 18px}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.card+.card{margin-top:10px}

/* hero balance */
.hero{padding:20px var(--pad) 22px}
.hero .lab{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hero .big{font-size:44px;font-weight:640;letter-spacing:-.03em;margin:4px 0 0;
  font-variant-numeric:tabular-nums;line-height:1.05}
.hero .as{font-size:12.5px;color:var(--ink-3);margin-top:6px}

.verdict{border-radius:var(--r);padding:14px var(--pad);margin-top:10px;border:1px solid}
.v-ok{background:rgba(78,201,160,.09);border-color:rgba(78,201,160,.35)}
.v-tight{background:rgba(227,179,65,.10);border-color:rgba(227,179,65,.38)}
.v-under{background:rgba(240,96,93,.10);border-color:rgba(240,96,93,.40)}
.verdict .t{font-weight:640;font-size:14.5px;display:flex;align-items:center;gap:8px}
.verdict .d{color:var(--ink-2);font-size:13px;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .nm > span{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.amt{font-variant-numeric:tabular-nums;font-weight:560;font-size:14.5px;white-space:nowrap}
.amt.i{color:var(--in)} .amt.o{color:var(--out)}
.bal{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-3);
  min-width:74px;text-align:right}
.bal.neg{color:var(--under)}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:650;padding:2px 7px;border-radius:6px;white-space:nowrap;margin-left:4px}
.p-due{background:rgba(227,179,65,.16);color:var(--tight)}
.p-past{background:rgba(240,96,93,.16);color:var(--under)}
.p-paid{background:rgba(78,201,160,.14);color:var(--in)}

.wk{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:22px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.wk b{font-size:13px;font-weight:650}
.wk span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* controls */
button,input,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:11px 15px;font-size:14.5px;font-weight:560;cursor:pointer;width:100%}
.btn:active{background:var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.sm{width:auto;padding:8px 13px;font-size:13.5px;border-radius:9px}
.btn.dan{color:var(--under);border-color:rgba(240,96,93,.4)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;margin-top:12px}

label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin:12px 0 5px;font-weight:600}
input,select{width:100%;background:var(--ground);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-size:16px}
input[type=date]{min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,19,23,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;color:var(--ink-3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:8px var(--pad) calc(20px + env(safe-area-inset-bottom));
  max-width:480px;margin:0 auto;max-height:88vh;overflow-y:auto;display:none}
.sheet.on{display:block}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 2px;font-size:17px;font-weight:650}

.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tog:last-of-type{border-bottom:0}
.tog .nm{flex:1;min-width:0}
.sw{width:44px;height:26px;border-radius:13px;background:var(--surface-2);
  border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--ink-3);transition:transform .15s,background .15s}
.sw.on{background:rgba(125,155,193,.28);border-color:var(--accent)}
.sw.on i{transform:translateX(18px);background:var(--accent)}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.cmp>div{background:var(--surface);padding:13px 14px}
.cmp .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.cmp .v{font-size:19px;font-weight:640;font-variant-numeric:tabular-nums;margin-top:3px}
.cmp .m{font-size:11.5px;color:var(--ink-3);margin-top:2px}

.empty{color:var(--ink-3);font-size:13.5px;text-align:center;padding:22px 10px}
.note{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.warnbar{background:rgba(227,179,65,.12);border:1px solid rgba(227,179,65,.4);
  border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--tight);margin-bottom:14px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:16px;margin-top:9px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:0;border-top-width:2px;
  vertical-align:middle;margin-right:6px}
</style>

<div class="wrap">
  <main id="v-today" class="on"></main>
  <main id="v-flow"></main>
  <main id="v-cast"></main>
  <main id="v-set"></main>
</div>

<nav><div class="tabs">
  <button class="tab on" data-v="today"><svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Today</button>
  <button class="tab" data-v="flow"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Flow</button>
  <button class="tab" data-v="cast"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 6-8"/><path d="M15 7h5v5"/></svg>Forecast</button>
  <button class="tab" data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg>Setup</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- dates (local, no timezone drift) ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const t = new Date(d); t.setDate(t.getDate()+n); return t; };
const lastDay = (y,m) => new Date(y, m+1, 0).getDate();
function addMonths(d,n){
  const t = new Date(d.getFullYear(), d.getMonth()+n, 1);
  t.setDate(Math.min(d.getDate(), lastDay(t.getFullYear(), t.getMonth())));
  return t;
}
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD  = d => `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`;
const fmtDY = d => `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const money = n => (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };

/* ---------- storage ---------- */
const KEY = "runway.v1";
let storageOK = true;
function load(){
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); }
  catch(e){ storageOK = false; }
  return null;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; render(); }
}

/* ---------- seed: the user's real position ---------- */
const SEED = {
  version: 1,
  balance: 51.39,
  balanceDate: "2026-08-07",
  cushion: 200,
  horizonWeeks: 13,
  recurring: [
    {id:"r1",  name:"Bruno's Restaurant",        type:"in",  amount:90,     freq:"weekly",      next:"2026-08-12", wk:"none",   cat:"Wages"},
    {id:"r2",  name:"Compunnel Software",        type:"in",  amount:790,    freq:"weekly",      next:"2026-08-14", wk:"none",   cat:"Wages"},
    {id:"r3",  name:"Apple: Claude",             type:"out", amount:21.10,  freq:"monthly",     next:"2026-08-04", wk:"none",   cat:"Subscriptions"},
    {id:"r4",  name:"OpenAI",                    type:"out", amount:20,     freq:"monthly",     next:"2026-08-05", wk:"none",   cat:"Subscriptions"},
    {id:"r5",  name:"Obsidian",                  type:"out", amount:10,     freq:"monthly",     next:"2026-08-05", wk:"none",   cat:"Subscriptions"},
    {id:"r6",  name:"Google One",                type:"out", amount:4.99,   freq:"monthly",     next:"2026-09-07", wk:"none",   cat:"Subscriptions"},
    {id:"r7",  name:"Upstart (loan)",            type:"out", amount:500,    freq:"monthly",     next:"2026-09-07", wk:"none",   cat:"Debt"},
    {id:"r8",  name:"Central Maine Power Co.",   type:"out", amount:163.50, freq:"monthly",     next:"2026-09-10", wk:"none",   cat:"Utilities"},
    {id:"r9",  name:"Apple: iCloud",             type:"out", amount:2.99,   freq:"monthly",     next:"2026-08-13", wk:"none",   cat:"Subscriptions"},
    {id:"r10", name:"Patrick Rombalski (rent)",  type:"out", amount:350,    freq:"semimonthly", next:"2026-08-14", wk:"before", cat:"Housing"},
    {id:"r11", name:"Spectrum",                  type:"out", amount:171.10, freq:"monthly",     next:"2026-08-16", wk:"none",   cat:"Utilities"},
    {id:"r12", name:"Maine Revenue Services",    type:"out", amount:45,     freq:"monthly",     next:"2026-08-16", wk:"none",   cat:"Taxes"},
    {id:"r13", name:"Metal Copy",                type:"out", amount:16.99,  freq:"monthly",     next:"2026-08-18", wk:"none",   cat:"Subscriptions"},
    {id:"r14", name:"Microsoft",                 type:"out", amount:13.70,  freq:"monthly",     next:"2026-08-25", wk:"none",   cat:"Subscriptions"},
    {id:"r15", name:"CMP: Payment Plan",         type:"out", amount:43.87,  freq:"monthly",     next:"2026-08-25", wk:"none",   cat:"Utilities"},
    {id:"r16", name:"Maine Revenue Services (2)",type:"out", amount:150,    freq:"monthly",     next:"2026-08-30", wk:"none",   cat:"Taxes"},
    {id:"r17", name:"Progressive Insurance",     type:"out", amount:143.37, freq:"monthly",     next:"2026-08-31", wk:"none",   cat:"Insurance"}
  ],
  // per-occurrence actuals, keyed ruleId|date
  actuals: {
    "r3|2026-08-04":21.10, "r4|2026-08-05":20, "r5|2026-08-05":10, "r1|2026-08-12":232.63
  },
  oneoffs: [
    {id:"o1", name:"Anthropic",            date:"2026-08-08", amount:6,     type:"out"},
    {id:"o2", name:"Hannaford Supermarket",date:"2026-08-11", amount:4.83,  type:"out"},
    {id:"o3", name:"Market Basket",        date:"2026-08-11", amount:21.43, type:"out"},
    {id:"o4", name:"7-Eleven",             date:"2026-08-11", amount:3.23,  type:"out"},
    {id:"o5", name:"Shell (2 charges)",    date:"2026-08-11", amount:16.26, type:"out"},
    {id:"o6", name:"Medication",           date:"2026-08-12", amount:120,   type:"out"}
  ],
  scenarios: []
};

let S = load() || JSON.parse(JSON.stringify(SEED));
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- occurrence engine ----------
   `next` is the next occurrence NOT yet settled, so it may sit in the past;
   the first one is allowed to fall before the balance date (a bill still owed)
   but later ones are not, or a rule would spray its back-history forward. */
function weekendShift(d, rule){
  const w = d.getDay();
  if (rule === "before"){ if (w===6) return addDays(d,-1); if (w===0) return addDays(d,-2); }
  if (rule === "after"){  if (w===6) return addDays(d,2);  if (w===0) return addDays(d,1);  }
  return d;
}
function occurrences(r, from, to){
  if (!r.next) return [];
  const anchor = parse(r.next), out = [];
  const legStart = anchor.getDate() <= 20 ? 0 : 1;
  const max = r.freq === "once" ? 1 : 500;
  for (let k = 0; k < max; k++){
    let d;
    if (r.freq === "weekly")           d = addDays(anchor, 7*k);
    else if (r.freq === "biweekly")    d = addDays(anchor, 14*k);
    else if (r.freq === "monthly")     d = addMonths(anchor, k);
    else if (r.freq === "once")        d = anchor;
    else if (r.freq === "semimonthly"){
      const leg = legStart + k, off = Math.floor(leg/2);
      const b = addMonths(new Date(anchor.getFullYear(), anchor.getMonth(), 1), off);
      d = (leg % 2) ? new Date(b.getFullYear(), b.getMonth(), lastDay(b.getFullYear(), b.getMonth()))
                    : new Date(b.getFullYear(), b.getMonth(), 15);
    } else return out;
    const adj = weekendShift(d, r.wk || "none");
    if (adj > to) break;
    const floor = k === 0 ? addDays(from, -90) : from;
    if (adj >= floor) out.push(adj);
  }
  return out;
}

/* ---------- projection ---------- */
function project(withScenarios){
  const from = parse(S.balanceDate);
  const to = addDays(from, S.horizonWeeks * 7 - 1);
  const items = [];
  const rules = S.recurring.filter(r => r.active !== false)
    .concat(withScenarios ? S.scenarios.filter(s => s.on && s.kind === "rec") : []);

  for (const r of rules){
    for (const d of occurrences(r, from, to)){
      const key = r.id + "|" + iso(d);
      const act = S.actuals[key];
      items.push({
        date: d, name: r.name, type: r.type,
        amount: act != null ? act : r.amount,
        ruleId: r.id, key, settled: act != null,
        scenario: !!r.scenario, sched: r.amount
      });
    }
  }
  for (const o of S.oneoffs){
    const d = parse(o.date);
    if (d >= addDays(from,-90) && d <= to)
      items.push({date:d, name:o.name, type:o.type||"out", amount:o.amount,
                  oneoff:o.id, settled:true, scenario:false});
  }
  if (withScenarios) for (const s of S.scenarios.filter(x => x.on && x.kind === "once")){
    const d = parse(s.next);
    if (d <= to) items.push({date:d, name:s.name, type:s.type, amount:s.amount, scenario:true});
  }

  items.sort((a,b) => a.date - b.date || (b.type==="in") - (a.type==="in"));

  let bal = S.balance, low = {bal: S.balance, date: from}, firstNeg = null;
  const series = [{t: from.getTime(), v: bal}];
  for (const it of items){
    bal += it.type === "in" ? it.amount : -it.amount;
    it.balance = bal;
    series.push({t: it.date.getTime(), v: bal});
    if (bal < low.bal){ low = {bal, date: it.date}; }
    if (bal < 0 && !firstNeg) firstNeg = it.date;
  }
  series.push({t: to.getTime(), v: bal});

  /* A forecast is about what is still coming. A dip that already happened and
     was survived is history, not a warning, so the headline figures are
     measured from today forward. */
  const t = today();
  let now = S.balance;
  for (const it of items) if (it.date <= t) now = it.balance;
  const ahead = {now, low:{bal: now, date: t}, firstNeg: null,
                 series: [{t: t.getTime(), v: now}]};
  for (const it of items){
    if (it.date <= t) continue;
    ahead.series.push({t: it.date.getTime(), v: it.balance});
    if (it.balance < ahead.low.bal) ahead.low = {bal: it.balance, date: it.date};
    if (it.balance < 0 && !ahead.firstNeg) ahead.firstNeg = it.date;
  }
  ahead.series.push({t: to.getTime(), v: bal});
  return {items, ending: bal, low, firstNeg, ahead, from, to, series};
}

/* ---------- shared bits ---------- */
function verdict(p){
  const a = p.ahead;
  const when = a.low.date <= today() ? "right now" : `on ${fmtD(a.low.date)}`;
  if (a.firstNeg) return {cls:"v-under", c:"var(--under)",
    t:`You run out on ${fmtD(a.firstNeg)}`,
    d:`From here the lowest you get is ${money(a.low.bal)} ${when}.`};
  if (a.low.bal < S.cushion) return {cls:"v-tight", c:"var(--tight)",
    t:"Tight, but you stay above zero",
    d:`Lowest point ahead is ${money(a.low.bal)} ${when} — under your ${money(S.cushion)} cushion.`};
  return {cls:"v-ok", c:"var(--in)", t:"You stay clear the whole way",
    d:`Lowest point ahead is ${money(a.low.bal)} ${when}.`};
}
const rowHTML = it => {
  const st = it.settled ? '<span class="pill p-paid">Done</span>'
    : it.date < today() ? '<span class="pill p-past">Past due</span>'
    : it.date <= addDays(today(),7) ? '<span class="pill p-due">Due</span>' : "";
  return `<div class="row">
    <div class="nm"><b>${esc(it.name)}</b><span>${fmtD(it.date)} ${st}</span></div>
    <div class="amt ${it.type==="in"?"i":"o"}">${it.type==="in"?"+":"−"}${money(it.amount).replace("-","")}</div>
    <div class="bal num ${it.balance<0?"neg":""}">${money(it.balance)}</div>
  </div>`;
};

/* ---------- view: today ---------- */
function viewToday(){
  const p = project(false), v = verdict(p), t = today();
  const soon = p.items.filter(i => i.date >= t && i.date <= addDays(t,7));
  const cur = p.items.filter(i => i.date <= t).slice(-1)[0];
  const bal = cur ? cur.balance : S.balance;
  $("#v-today").innerHTML = `
    ${storageOK ? "" : `<div class="warnbar">This browser is blocking local storage, so changes
      will not survive a reload. Use Export on the Setup tab to keep a copy.</div>`}
    <div class="card hero">
      <div class="lab">Balance today</div>
      <div class="big" style="color:${bal<0?"var(--under)":"var(--ink)"}">${money(bal)}</div>
      <div class="as">${fmtDY(t)} · after everything recorded through today</div>
    </div>
    <div class="verdict ${v.cls}">
      <div class="t"><span class="dot" style="background:${v.c}"></span>${esc(v.t)}</div>
      <div class="d">${esc(v.d)}</div>
    </div>
    <button class="btn pri" style="margin-top:10px" onclick="sheetExpense()">Log an expense</button>
    <h2>Next 7 days</h2>
    <div class="card">${soon.length ? soon.map(rowHTML).join("")
      : '<div class="empty">Nothing scheduled in the next week.</div>'}</div>
    <div class="note">Running balance assumes every scheduled item lands as planned.
      Tap anything on the Flow tab to record what actually happened.</div>`;
}

/* ---------- view: flow ---------- */
function viewFlow(){
  const p = project(false);
  const from = p.from;
  const weeks = {};
  for (const it of p.items){
    const w = Math.max(0, Math.floor((it.date - from) / 6048e5));
    (weeks[w] = weeks[w] || []).push(it);
  }
  let h = `<h1>Cash flow</h1><p class="sub">${fmtDY(p.from)} → ${fmtDY(p.to)}
    · tap a row to record the real amount</p>`;
  for (const k of Object.keys(weeks).sort((a,b)=>a-b)){
    const ws = addDays(from, k*7), we = addDays(ws,6);
    const rows = weeks[k];
    const lo = Math.min(...rows.map(r => r.balance));
    h += `<div class="wk"><b>${fmtD(ws)} – ${fmtD(we)}</b>
      <span class="${lo<0?"neg":""}" style="${lo<0?"color:var(--under)":""}">low ${money(lo)}</span></div>
      <div class="card" style="padding:2px 14px">` +
      rows.map(it => `<div onclick="sheetItem('${it.key||""}','${it.oneoff||""}')"
        style="cursor:pointer">${rowHTML(it)}</div>`).join("") + `</div>`;
  }
  $("#v-flow").innerHTML = h;
}

/* ---------- chart ---------- */
function chart(base, scen){
  const W = 448, H = 150, PL = 4, PR = 4, PT = 12, PB = 16;
  const all = base.concat(scen || []);
  const t0 = Math.min(...all.map(p=>p.t)), t1 = Math.max(...all.map(p=>p.t));
  let vmin = Math.min(0, ...all.map(p=>p.v)), vmax = Math.max(...all.map(p=>p.v));
  const padv = Math.max(20, (vmax-vmin)*.12); vmax += padv; vmin -= padv/2;
  const X = t => PL + (t-t0)/(t1-t0||1) * (W-PL-PR);
  const Y = v => PT + (1-(v-vmin)/(vmax-vmin||1)) * (H-PT-PB);
  const path = pts => pts.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const zero = Y(0);
  // The lead line is whatever the reader is being asked to judge: the scenario
  // when one is on, otherwise the baseline itself.
  const lead = scen || base;
  const areaD = `${path(lead)} L ${X(lead[lead.length-1].t).toFixed(1)} ${zero.toFixed(1)} L ${X(lead[0].t).toFixed(1)} ${zero.toFixed(1)} Z`;
  const lowPt = lead.reduce((a,b) => b.v < a.v ? b : a);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Projected balance, ${fmtD(new Date(t0))} to ${fmtD(new Date(t1))}. Lowest ${money(lowPt.v)}.">
    <path d="${areaD}" fill="var(--chart)" opacity=".12"/>
    <line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="var(--under)"
      stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
    ${scen ? `<path d="${path(base)}" fill="none" stroke="var(--ink-3)" stroke-width="1.5"
      stroke-dasharray="4 3" stroke-linejoin="round"/>` : ""}
    <path d="${path(lead)}" fill="none" stroke="var(--chart)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(lowPt.t).toFixed(1)}" cy="${Y(lowPt.v).toFixed(1)}" r="3.5"
      fill="${lowPt.v<0?"var(--under)":"var(--chart)"}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(W-34, Math.max(34, X(lowPt.t))).toFixed(1)}"
      y="${(Y(lowPt.v) > H/2 ? Y(lowPt.v)-10 : Y(lowPt.v)+16).toFixed(1)}" font-size="10.5"
      font-weight="700" text-anchor="middle" fill="${lowPt.v<0?"var(--under)":"var(--ink-2)"}"
      stroke="var(--surface)" stroke-width="3" paint-order="stroke"
      >${money(lowPt.v)}</text>
    <text x="0" y="${H-3}" fill="var(--ink-3)" font-size="10">${fmtD(new Date(t0))}</text>
    <text x="${W}" y="${H-3}" fill="var(--ink-3)" font-size="10" text-anchor="end">${fmtD(new Date(t1))}</text>
  </svg>`;
}

/* ---------- view: forecast ---------- */
function viewCast(){
  const base = project(false);
  const any = S.scenarios.some(s => s.on);
  const scen = any ? project(true) : null;
  const p = scen || base;
  const v = verdict(p);
  const dLow = scen ? scen.ahead.low.bal - base.ahead.low.bal : 0;
  const dEnd = scen ? scen.ending - base.ending : 0;

  $("#v-cast").innerHTML = `
    <h1>Forecast</h1>
    <p class="sub">Try something on without touching your real numbers.
      Everything here is a what-if until you decide.</p>

    <div class="verdict ${v.cls}">
      <div class="t"><span class="dot" style="background:${v.c}"></span>${esc(v.t)}</div>
      <div class="d">${esc(v.d)}${any ? "" : " Nothing switched on — this is your baseline."}</div>
    </div>

    <div class="card" style="margin-top:10px">
      ${chart(base.ahead.series, scen ? scen.ahead.series : null)}
      <div class="legend">
        ${any ? `<span><i style="border-top:2px solid var(--chart)"></i>With what-ifs on</span>
          <span><i style="border-top:2px dashed var(--ink-3)"></i>As things stand</span>`
        : `<span><i style="border-top:2px solid var(--chart)"></i>As things stand</span>`}
        <span><i style="border-top:2px dashed var(--under)"></i>Zero</span>
      </div>
    </div>

    ${any ? `<div class="cmp">
      <div><div class="k">Lowest point</div>
        <div class="v" style="color:${scen.ahead.low.bal<0?"var(--under)":"var(--ink)"}">${money(scen.ahead.low.bal)}</div>
        <div class="m">${dLow>=0?"+":""}${money(dLow)} vs now · ${fmtD(scen.ahead.low.date)}</div></div>
      <div><div class="k">First day under</div>
        <div class="v" style="color:${scen.ahead.firstNeg?"var(--under)":"var(--in)"};font-size:${scen.ahead.firstNeg?"19px":"16px"}">
          ${scen.ahead.firstNeg ? fmtD(scen.ahead.firstNeg) : "Never"}</div>
        <div class="m">${base.ahead.firstNeg ? "was "+fmtD(base.ahead.firstNeg) : "clear without it"}</div></div>
      <div><div class="k">Ending balance</div>
        <div class="v">${money(scen.ending)}</div>
        <div class="m">${dEnd>=0?"+":""}${money(dEnd)} vs now</div></div>
      <div><div class="k">Weeks covered</div>
        <div class="v">${S.horizonWeeks}</div>
        <div class="m">to ${fmtDY(base.to)}</div></div>
    </div>` : ""}

    <h2>What-ifs</h2>
    <div class="card">
      ${S.scenarios.length ? S.scenarios.map(s => `<div class="tog">
        <div class="sw ${s.on?"on":""}" onclick="toggleScen('${s.id}')" role="switch"
          aria-checked="${!!s.on}" tabindex="0"><i></i></div>
        <div class="nm"><b style="font-weight:500;font-size:14.5px">${esc(s.name)}</b>
          <span style="color:var(--ink-3);font-size:12px;display:block">
            ${s.type==="in"?"+":"−"}${money(s.amount).replace("-","")} ·
            ${s.kind==="once"?"one time":freqLabel(s.freq)} · from ${fmtD(parse(s.next))}</span></div>
        <button class="btn sm dan" onclick="delScen('${s.id}')">Remove</button>
      </div>`).join("") : '<div class="empty">No what-ifs yet. Add one below to see how it lands.</div>'}
    </div>
    <button class="btn pri" style="margin-top:10px" onclick="sheetScen()">Add a what-if</button>
    <div class="note">A what-if never changes your recurring list or your balance.
      Switch it off and the forecast snaps back.</div>`;
}
const freqLabel = f => ({weekly:"every week", biweekly:"every 2 weeks", monthly:"every month",
  semimonthly:"15th &amp; last day", once:"one time"}[f] || f);

/* ---------- view: setup ---------- */
function viewSet(){
  $("#v-set").innerHTML = `
    <h1>Setup</h1><p class="sub">Your starting point and the bills that repeat.</p>
    <div class="card">
      <label for="bal">Balance</label>
      <input id="bal" type="number" step="0.01" value="${S.balance}"
        onchange="S.balance=+this.value||0;save();render()">
      <label for="bd">As of</label>
      <input id="bd" type="date" value="${S.balanceDate}"
        onchange="S.balanceDate=this.value;save();render()">
      <div class="grid2">
        <div><label for="cu">Cushion</label>
          <input id="cu" type="number" step="1" value="${S.cushion}"
            onchange="S.cushion=+this.value||0;save();render()"></div>
        <div><label for="hz">Weeks ahead</label>
          <input id="hz" type="number" min="4" max="52" value="${S.horizonWeeks}"
            onchange="S.horizonWeeks=Math.min(52,Math.max(4,+this.value||13));save();render()"></div>
      </div>
    </div>
    <h2>Repeating</h2>
    <div class="card" style="padding:2px 14px">
      ${S.recurring.map(r => `<div class="row" onclick="sheetRule('${r.id}')" style="cursor:pointer">
        <div class="nm"><b${r.active===false?' style="color:var(--ink-3)"':""}>${esc(r.name)}</b>
          <span>${freqLabel(r.freq)} · next ${fmtD(parse(r.next))}${r.active===false?" · paused":""}</span></div>
        <div class="amt ${r.type==="in"?"i":"o"}">${r.type==="in"?"+":"−"}${money(r.amount).replace("-","")}</div>
      </div>`).join("")}
    </div>
    <button class="btn pri" style="margin-top:10px" onclick="sheetRule()">Add a repeating item</button>
    <h2>Your data</h2>
    <div class="card">
      <div class="note" style="margin:0 0 12px">Everything lives on this phone only.
        Nothing is uploaded. Export keeps a copy you can restore later.</div>
      <div class="btns" style="margin:0">
        <button class="btn" onclick="doExport()">Export</button>
        <button class="btn" onclick="$('#imp').click()">Import</button>
      </div>
      <input id="imp" type="file" accept="application/json" style="display:none" onchange="doImport(this)">
      <button class="btn dan" style="margin-top:8px" onclick="resetAll()">Reset to starting data</button>
    </div>`;
}

/* ---------- sheets ---------- */
function openSheet(html){ $("#sheet").innerHTML = `<div class="grip"></div>` + html;
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeSheet;

function sheetExpense(){
  openSheet(`<h3>Log an expense</h3>
    <p class="sub">Something you spent that isn't a repeating bill.</p>
    <label for="en">What was it</label><input id="en" placeholder="Groceries">
    <div class="grid2">
      <div><label for="ea">Amount</label><input id="ea" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
      <div><label for="ed">Date</label><input id="ed" type="date" value="${iso(today())}"></div>
    </div>
    <div class="btns"><button class="btn" onclick="closeSheet()">Cancel</button>
      <button class="btn pri" onclick="addExpense()">Add</button></div>`);
  setTimeout(()=>$("#en").focus(), 60);
}
function addExpense(){
  const n = $("#en").value.trim(), a = +$("#ea").value, d = $("#ed").value;
  if (!n || !a || !d) return;
  S.oneoffs.push({id:uid(), name:n, amount:Math.abs(a), date:d, type:"out"});
  save(); closeSheet(); render();
}

function sheetItem(key, oneoff){
  if (oneoff){
    const o = S.oneoffs.find(x => x.id === oneoff); if (!o) return;
    openSheet(`<h3>${esc(o.name)}</h3><p class="sub">${fmtDY(parse(o.date))}</p>
      <label for="ia">Amount</label><input id="ia" type="number" step="0.01" value="${o.amount}">
      <div class="btns"><button class="btn dan" onclick="delOneoff('${o.id}')">Delete</button>
        <button class="btn pri" onclick="saveOneoff('${o.id}')">Save</button></div>`);
    return;
  }
  if (!key) return;
  const [rid, d] = key.split("|");
  const r = S.recurring.find(x => x.id === rid); if (!r) return;
  const act = S.actuals[key];
  openSheet(`<h3>${esc(r.name)}</h3>
    <p class="sub">${fmtDY(parse(d))} · scheduled ${money(r.amount)}</p>
    <label for="aa">What actually ${r.type==="in"?"came in":"went out"}</label>
    <input id="aa" type="number" step="0.01" inputmode="decimal"
      value="${act != null ? act : ""}" placeholder="${r.amount}">
    <div class="note">Leave blank to keep using the scheduled amount.
      Enter 0 if it didn't happen.</div>
    <div class="btns">
      ${act != null ? `<button class="btn" onclick="clearActual('${key}')">Clear</button>` : ""}
      <button class="btn pri" onclick="setActual('${key}')">Save</button></div>`);
  setTimeout(()=>$("#aa").focus(), 60);
}
function setActual(key){ const v = $("#aa").value;
  if (v === "") delete S.actuals[key]; else S.actuals[key] = Math.abs(+v);
  save(); closeSheet(); render(); }
function clearActual(key){ delete S.actuals[key]; save(); closeSheet(); render(); }
function saveOneoff(id){ const o = S.oneoffs.find(x=>x.id===id);
  o.amount = Math.abs(+$("#ia").value)||0; save(); closeSheet(); render(); }
function delOneoff(id){ S.oneoffs = S.oneoffs.filter(x=>x.id!==id); save(); closeSheet(); render(); }

function ruleForm(r, forScenario){
  return `<label for="rn">Name</label><input id="rn" value="${esc(r.name||"")}" placeholder="Car payment">
    <div class="grid2">
      <div><label for="ra">Amount</label>
        <input id="ra" type="number" step="0.01" inputmode="decimal" value="${r.amount||""}" placeholder="0.00"></div>
      <div><label for="rt">Direction</label><select id="rt">
        <option value="out"${r.type!=="in"?" selected":""}>Money out</option>
        <option value="in"${r.type==="in"?" selected":""}>Money in</option></select></div>
    </div>
    <label for="rf">How often</label><select id="rf">
      ${["weekly","biweekly","monthly","semimonthly","once"].map(f =>
        `<option value="${f}"${(r.freq||"monthly")===f?" selected":""}>${freqLabel(f)}</option>`).join("")}
    </select>
    <label for="rd">${forScenario ? "Starting" : "Next due"}</label>
    <input id="rd" type="date" value="${r.next || iso(today())}">
    ${forScenario ? "" : `<label for="rw">If it lands on a weekend</label><select id="rw">
      <option value="none"${(r.wk||"none")==="none"?" selected":""}>Leave it</option>
      <option value="before"${r.wk==="before"?" selected":""}>Move to Friday</option>
      <option value="after"${r.wk==="after"?" selected":""}>Move to Monday</option></select>`}`;
}
function readRule(){
  return {name:$("#rn").value.trim(), amount:Math.abs(+$("#ra").value)||0,
    type:$("#rt").value, freq:$("#rf").value, next:$("#rd").value,
    wk: $("#rw") ? $("#rw").value : "none"};
}
function sheetRule(id){
  const r = id ? S.recurring.find(x=>x.id===id) : {};
  openSheet(`<h3>${id ? esc(r.name) : "New repeating item"}</h3>
    <p class="sub">${id ? "Change it, pause it, or remove it." : "A bill or a paycheck that comes round again."}</p>
    ${ruleForm(r, false)}
    <div class="btns">
      ${id ? `<button class="btn" onclick="toggleRule('${id}')">${r.active===false?"Resume":"Pause"}</button>` : ""}
      <button class="btn pri" onclick="saveRule('${id||""}')">Save</button></div>
    ${id ? `<button class="btn dan" style="margin-top:8px" onclick="delRule('${id}')">Remove</button>` : ""}`);
}
function saveRule(id){
  const f = readRule(); if (!f.name || !f.next) return;
  if (id){ Object.assign(S.recurring.find(x=>x.id===id), f); }
  else S.recurring.push(Object.assign({id:uid(), cat:"", active:true}, f));
  save(); closeSheet(); render();
}
function toggleRule(id){ const r = S.recurring.find(x=>x.id===id);
  r.active = r.active === false; save(); closeSheet(); render(); }
function delRule(id){ S.recurring = S.recurring.filter(x=>x.id!==id); save(); closeSheet(); render(); }

function sheetScen(){
  openSheet(`<h3>Add a what-if</h3>
    <p class="sub">Something you're considering. It won't touch your real numbers.</p>
    ${ruleForm({freq:"monthly"}, true)}
    <div class="btns"><button class="btn" onclick="closeSheet()">Cancel</button>
      <button class="btn pri" onclick="addScen()">See how it lands</button></div>`);
  setTimeout(()=>$("#rn").focus(), 60);
}
function addScen(){
  const f = readRule(); if (!f.name || !f.next || !f.amount) return;
  S.scenarios.push({id:uid(), on:true, scenario:true,
    kind: f.freq === "once" ? "once" : "rec", ...f});
  save(); closeSheet(); go("cast"); render();
}
function toggleScen(id){ const s = S.scenarios.find(x=>x.id===id); s.on = !s.on; save(); render(); }
function delScen(id){ S.scenarios = S.scenarios.filter(x=>x.id!==id); save(); render(); }

/* ---------- data in / out ---------- */
async function doExport(){
  const name = `runway-${iso(today())}.json`, data = JSON.stringify(S, null, 2);
  try {
    if (window.claude && window.claude.downloads){
      await window.claude.downloads.save({filename:name, data}); return;
    }
  } catch(e){ /* viewer declined or unavailable - fall through */ }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function doImport(el){
  const f = el.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d.recurring) throw new Error("not a Runway file");
      S = d; save(); render();
    } catch(e){ alert("That file could not be read as a Runway backup."); }
  };
  rd.readAsText(f); el.value = "";
}
function resetAll(){
  if (!confirm("Replace everything with the starting data? Export first if you want a copy.")) return;
  S = JSON.parse(JSON.stringify(SEED)); save(); render();
}

/* ---------- shell ---------- */
let view = "today";
function go(v){
  view = v;
  document.querySelectorAll("main").forEach(m => m.classList.toggle("on", m.id === "v-"+v));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { go(b.dataset.v); render(); });
function render(){ ({today:viewToday, flow:viewFlow, cast:viewCast, set:viewSet})[view](); }
render();
</script>
